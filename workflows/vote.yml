name: Bot Vote Hyping

on:
  schedule:
    # Déclenchement automatique toutes les 2 heures (Le site autorise le vote toutes les 1h30)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Ajoute un bouton manuel sur GitHub pour tester quand vous voulez

jobs:
  voter:
    runs-on: ubuntu-latest

    steps:
    - name: Copie des fichiers
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installer les outils (Playwright et Requests)
      run: |
        pip install requests playwright
        playwright install chromium --with-deps

    - name: Lancement du script de vote
      run: python bot.py

    - name: Sauvegarder la preuve visuelle (Capture d'écran)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots-de-controle
        path: "*.png"
